global:
  resolve_timeout: 5m

route:
  receiver: discard
  group_by: [alertname, service_id, task_id, probe_type]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1m
  routes:
    - receiver: cloudsentinel-incidents
      matchers:
        - cloudsentinel_incident="true"

receivers:
  - name: discard
  - name: cloudsentinel-incidents
    webhook_configs:
      - url: http://cloudsentinel-api:8080/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: __WEBHOOK_TOKEN__
