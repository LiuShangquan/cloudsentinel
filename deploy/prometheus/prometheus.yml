global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/cloudsentinel.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: cloudsentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudsentinel-api:8080"]
  - job_name: cloudsentinel-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudsentinel-worker:9091"]
