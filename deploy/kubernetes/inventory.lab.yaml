cluster:
  name: cloudsentinel-k8s
  region: cn-beijing
  lifecycle: student-lab
  deployment_ready: false
  accepted_risks:
    - The purchased control-plane, monitoring, data and operations nodes have only 2 GiB memory and are suitable only for low-load lab use.
    - The lab MySQL and Redis StatefulSets share the worker-data-01 failure domain and are not highly available.
    - Public IPv4 ICMP remains enabled for lab diagnostics.
    - Public TCP 22 remains reachable from 0.0.0.0/0 because the operator has no fixed public source address; all nodes must enforce key-only SSH.
    - All eight nodes temporarily share one security group with intra-group mutual access instead of role-separated least-privilege groups.
  blockers:
    - Complete cluster-wide HA, cross-node Pod, Service, DNS, NetworkPolicy, resource-pressure and NLB backend-health acceptance before starting GitOps platform deployment.

  control_plane_endpoint: "nlb-axdxf21jombh758m09.cn-beijing.nlb.aliyuncsslb.com:6443"
