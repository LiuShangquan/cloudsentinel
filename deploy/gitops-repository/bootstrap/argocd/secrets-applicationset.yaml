apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudsentinel-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: staging
            namespace: cloudsentinel-staging
          - environment: production
            namespace: cloudsentinel-production
  template:
    metadata:
      name: cloudsentinel-secrets-{{.environment}}
      labels:
        app.kubernetes.io/part-of: cloudsentinel
        environment.cloudsentinel.io/name: "{{.environment}}"
    spec:
      project: cloudsentinel
      source:
        repoURL: https://github.com/REPLACE_ORG/cloudsentinel-gitops.git
        targetRevision: main
        path: platform/cloudsentinel-secrets/overlays/{{.environment}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
