apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudsentinel-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: staging
            overlay: lab-staging
            namespace: cloudsentinel-staging
            autoSync: true
          - environment: production
            overlay: lab-production
            namespace: cloudsentinel-production
            autoSync: false
  template:
    metadata:
      name: cloudsentinel-{{.environment}}
      labels:
        app.kubernetes.io/part-of: cloudsentinel
        environment.cloudsentinel.io/name: "{{.environment}}"
    spec:
      project: cloudsentinel
      source:
        repoURL: git@github.com:LiuShangquan/cloudsentinel-gitops.git
        targetRevision: main
        path: apps/cloudsentinel/overlays/{{.overlay}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
    {{- end }}
