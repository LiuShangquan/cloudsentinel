apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudsentinel-data-lab
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloudsentinel
    environment.cloudsentinel.io/name: lab
spec:
  project: cloudsentinel
  source:
    repoURL: git@github.com:LiuShangquan/cloudsentinel-gitops.git
    targetRevision: main
    path: platform/cloudsentinel-data/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudsentinel-data
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
