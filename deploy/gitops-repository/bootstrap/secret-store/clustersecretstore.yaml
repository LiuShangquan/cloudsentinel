apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloudsentinel-secret-store
spec:
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - cloudsentinel-data
              - cloudsentinel-staging
              - cloudsentinel-production
              - argocd
              - monitoring
  provider:
    kubernetes:
      remoteNamespace: cloudsentinel-secret-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: cloudsentinel-secret-source
          key: ca.crt
      auth:
        serviceAccount:
          name: cloudsentinel-secret-reader
          namespace: cloudsentinel-secret-source
