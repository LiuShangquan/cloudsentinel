apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloudsentinel-local-retain
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
reclaimPolicy: Retain
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cloudsentinel-lab-mysql
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cloudsentinel-local-retain
  local:
    path: /var/lib/cloudsentinel/mysql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-data-01]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cloudsentinel-lab-redis
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cloudsentinel-local-retain
  local:
    path: /var/lib/cloudsentinel/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-data-01]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cloudsentinel-lab-backup
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cloudsentinel-local-retain
  local:
    path: /var/lib/cloudsentinel/backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker-data-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: cloudsentinel-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cloudsentinel-local-retain
  volumeName: cloudsentinel-lab-mysql
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: cloudsentinel-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cloudsentinel-local-retain
  volumeName: cloudsentinel-lab-redis
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-backup
  namespace: cloudsentinel-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-30"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cloudsentinel-local-retain
  volumeName: cloudsentinel-lab-backup
  resources:
    requests:
      storage: 5Gi
