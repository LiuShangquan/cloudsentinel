apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudsentinel-mysql-config
  namespace: cloudsentinel-data
data:
  cloudsentinel.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_0900_ai_ci
    default-time-zone=+00:00
    innodb-buffer-pool-size=256M
    innodb-redo-log-capacity=128M
    max-connections=60
    skip-name-resolve=ON
    performance-schema=OFF
    slow-query-log=ON
    long-query-time=1
    log-error-verbosity=2
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cloudsentinel-data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cloudsentinel-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: cloudsentinel-data
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  serviceName: mysql
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsentinel-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsentinel-mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cloudsentinel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: cloudsentinel-registry
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: worker-data-01
        node-role: data
      tolerations:
        - key: dedicated
          operator: Equal
          value: data
          effect: NoSchedule
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: cloudsentinel-mysql
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_ROOT_HOST
              value: "%"
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 896Mi}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "mysqladmin ping -h 127.0.0.1 --silent"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "mysqladmin ping -h 127.0.0.1 --silent"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "mysqladmin ping -h 127.0.0.1 --silent"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/cloudsentinel.cnf
              subPath: cloudsentinel.cnf
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: config
          configMap:
            name: cloudsentinel-mysql-config
            defaultMode: 0444
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudsentinel-mysql-bootstrap
  namespace: cloudsentinel-data
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsentinel-mysql-bootstrap
        app.kubernetes.io/part-of: cloudsentinel
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: cloudsentinel-registry
      nodeSelector:
        kubernetes.io/hostname: worker-data-01
        node-role: data
      tolerations:
        - {key: dedicated, operator: Equal, value: data, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: cloudsentinel-mysql
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              for name in MYSQL_STAGING_PASSWORD MYSQL_STAGING_MIGRATION_PASSWORD MYSQL_PRODUCTION_PASSWORD MYSQL_PRODUCTION_MIGRATION_PASSWORD MYSQL_BACKUP_PASSWORD; do
                value="${!name}"
                if [[ ! "${value}" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
                  echo "${name} must be 32-128 characters from [A-Za-z0-9_-]" >&2
                  exit 1
                fi
              done
              until mysqladmin ping --host=mysql --user=root --silent; do sleep 2; done
              mysql --host=mysql --user=root <<-EOSQL
              CREATE DATABASE IF NOT EXISTS cloudsentinel_staging CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
              CREATE DATABASE IF NOT EXISTS cloudsentinel_production CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
              CREATE USER IF NOT EXISTS 'cloudsentinel_staging'@'%' IDENTIFIED BY '${MYSQL_STAGING_PASSWORD}';
              ALTER USER 'cloudsentinel_staging'@'%' IDENTIFIED BY '${MYSQL_STAGING_PASSWORD}';
              GRANT SELECT, INSERT, UPDATE, DELETE ON cloudsentinel_staging.* TO 'cloudsentinel_staging'@'%';
              CREATE USER IF NOT EXISTS 'cloudsentinel_staging_migrate'@'%' IDENTIFIED BY '${MYSQL_STAGING_MIGRATION_PASSWORD}';
              ALTER USER 'cloudsentinel_staging_migrate'@'%' IDENTIFIED BY '${MYSQL_STAGING_MIGRATION_PASSWORD}';
              GRANT ALL PRIVILEGES ON cloudsentinel_staging.* TO 'cloudsentinel_staging_migrate'@'%';
              CREATE USER IF NOT EXISTS 'cloudsentinel_production'@'%' IDENTIFIED BY '${MYSQL_PRODUCTION_PASSWORD}';
              ALTER USER 'cloudsentinel_production'@'%' IDENTIFIED BY '${MYSQL_PRODUCTION_PASSWORD}';
              GRANT SELECT, INSERT, UPDATE, DELETE ON cloudsentinel_production.* TO 'cloudsentinel_production'@'%';
              CREATE USER IF NOT EXISTS 'cloudsentinel_production_migrate'@'%' IDENTIFIED BY '${MYSQL_PRODUCTION_MIGRATION_PASSWORD}';
              ALTER USER 'cloudsentinel_production_migrate'@'%' IDENTIFIED BY '${MYSQL_PRODUCTION_MIGRATION_PASSWORD}';
              GRANT ALL PRIVILEGES ON cloudsentinel_production.* TO 'cloudsentinel_production_migrate'@'%';
              CREATE USER IF NOT EXISTS 'cloudsentinel_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
              ALTER USER 'cloudsentinel_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
              GRANT SELECT, SHOW VIEW, TRIGGER, EVENT, LOCK TABLES ON *.* TO 'cloudsentinel_backup'@'%';
              FLUSH PRIVILEGES;
              EOSQL
          env:
            - name: MYSQL_PWD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_STAGING_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_STAGING_PASSWORD}}
            - name: MYSQL_STAGING_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_STAGING_MIGRATION_PASSWORD}}
            - name: MYSQL_PRODUCTION_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_PRODUCTION_PASSWORD}}
            - name: MYSQL_PRODUCTION_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_PRODUCTION_MIGRATION_PASSWORD}}
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom: {secretKeyRef: {name: cloudsentinel-data-credentials, key: MYSQL_BACKUP_PASSWORD}}
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
