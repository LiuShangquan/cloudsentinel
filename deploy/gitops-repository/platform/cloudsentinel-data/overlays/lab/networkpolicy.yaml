apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudsentinel-data-default-deny-ingress
  namespace: cloudsentinel-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudsentinel-data-ingress
  namespace: cloudsentinel-data
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [cloudsentinel-mysql, cloudsentinel-redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudsentinel-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudsentinel-staging
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudsentinel-production
      ports:
        - {protocol: TCP, port: 3306}
        - {protocol: TCP, port: 6379}
