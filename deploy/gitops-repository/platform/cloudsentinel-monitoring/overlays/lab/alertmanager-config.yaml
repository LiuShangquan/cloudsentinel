apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: discard
      group_by: [alertname, service_id, task_id, probe_type]
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1m
      routes:
        - receiver: cloudsentinel-incidents
          matchers:
            - cloudsentinel_incident="true"
    receivers:
      - name: discard
      - name: cloudsentinel-incidents
        webhook_configs:
          - url: http://cloudsentinel-api.cloudsentinel-staging.svc.cluster.local/api/v1/alerts/webhook
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/webhook-token

