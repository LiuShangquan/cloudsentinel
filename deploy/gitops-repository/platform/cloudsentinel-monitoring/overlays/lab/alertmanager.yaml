apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  serviceName: alertmanager
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        node-role: monitoring
        kubernetes.io/hostname: worker-monitor
      tolerations:
        - key: dedicated
          operator: Equal
          value: monitoring
          effect: NoSchedule
      imagePullSecrets:
        - name: cloudsentinel-registry
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: cloudsentinel-alertmanager
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true}
            - {name: secrets, mountPath: /etc/alertmanager/secrets, readOnly: true}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: cloudsentinel-monitoring-runtime
            defaultMode: 0440
            items:
              - key: ALERTMANAGER_WEBHOOK_TOKEN
                path: webhook-token
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
