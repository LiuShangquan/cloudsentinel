apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cloudsentinel
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
data:
  cloudsentinel-overview.json: |
    {
      "uid": "cloudsentinel-overview",
      "title": "CloudSentinel Overview",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id":1,"type":"timeseries","title":"HTTP Request Rate","gridPos":{"x":0,"y":0,"w":6,"h":7},"targets":[{"expr":"sum(rate(cloudsentinel_http_requests_total[5m]))","refId":"A"}]},
        {"id":2,"type":"timeseries","title":"HTTP 5xx","gridPos":{"x":6,"y":0,"w":6,"h":7},"targets":[{"expr":"sum(rate(cloudsentinel_http_requests_total{status=~\"5..\"}[5m]))","refId":"A"}]},
        {"id":3,"type":"stat","title":"API P95","gridPos":{"x":12,"y":0,"w":6,"h":7},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(cloudsentinel_http_request_duration_seconds_bucket[5m])))","refId":"A"}]},
        {"id":4,"type":"stat","title":"API P99","gridPos":{"x":18,"y":0,"w":6,"h":7},"targets":[{"expr":"histogram_quantile(0.99, sum by (le) (rate(cloudsentinel_http_request_duration_seconds_bucket[5m])))","refId":"A"}]},
        {"id":5,"type":"timeseries","title":"Probe Throughput","gridPos":{"x":0,"y":7,"w":6,"h":7},"targets":[{"expr":"sum(rate(cloudsentinel_probe_total[5m]))","refId":"A"}]},
        {"id":6,"type":"stat","title":"Probe Success Rate","gridPos":{"x":6,"y":7,"w":6,"h":7},"targets":[{"expr":"sum(rate(cloudsentinel_probe_total{outcome=\"success\"}[5m])) / clamp_min(sum(rate(cloudsentinel_probe_total[5m])), 0.000001)","refId":"A"}]},
        {"id":7,"type":"stat","title":"Probe P95","gridPos":{"x":12,"y":7,"w":6,"h":7},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(cloudsentinel_probe_duration_seconds_bucket[5m])))","refId":"A"}]},
        {"id":8,"type":"stat","title":"Probe P99","gridPos":{"x":18,"y":7,"w":6,"h":7},"targets":[{"expr":"histogram_quantile(0.99, sum by (le) (rate(cloudsentinel_probe_duration_seconds_bucket[5m])))","refId":"A"}]},
        {"id":9,"type":"table","title":"Latest Probe Status","gridPos":{"x":0,"y":14,"w":8,"h":7},"targets":[{"expr":"cloudsentinel_probe_status","instant":true,"refId":"A"}]},
        {"id":10,"type":"stat","title":"Worker Active","gridPos":{"x":8,"y":14,"w":4,"h":7},"targets":[{"expr":"sum(cloudsentinel_worker_active)","refId":"A"}]},
        {"id":11,"type":"stat","title":"Queue Backlog","gridPos":{"x":12,"y":14,"w":4,"h":7},"targets":[{"expr":"sum(cloudsentinel_worker_queue_length)","refId":"A"}]},
        {"id":12,"type":"stat","title":"Target UP","gridPos":{"x":16,"y":14,"w":4,"h":7},"targets":[{"expr":"sum(up)","refId":"A"}]},
        {"id":13,"type":"stat","title":"Active Incidents","gridPos":{"x":20,"y":14,"w":4,"h":7},"targets":[{"expr":"cloudsentinel_active_incidents","refId":"A"}]},
        {"id":14,"type":"table","title":"Alert Status","gridPos":{"x":0,"y":21,"w":24,"h":7},"targets":[{"expr":"ALERTS{alertstate=\"firing\"}","instant":true,"refId":"A"}]}
      ],
      "templating": {"list": []},
      "annotations": {"list": []}
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: https
      port: 3000
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        node-role: monitoring
        kubernetes.io/hostname: worker-monitor
      tolerations:
        - key: dedicated
          operator: Equal
          value: monitoring
          effect: NoSchedule
      imagePullSecrets:
        - name: cloudsentinel-registry
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: cloudsentinel-grafana
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 3000
          env:
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: cloudsentinel-monitoring-runtime, key: GRAFANA_ADMIN_USER}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: cloudsentinel-monitoring-runtime, key: GRAFANA_ADMIN_PASSWORD}}}
            - {name: GF_SERVER_PROTOCOL, value: "https"}
            - {name: GF_SERVER_HTTP_PORT, value: "3000"}
            - {name: GF_SERVER_ROOT_URL, valueFrom: {secretKeyRef: {name: grafana-public-tls, key: public-url}}}
            - {name: GF_SERVER_CERT_FILE, value: "/etc/grafana/tls/tls.crt"}
            - {name: GF_SERVER_CERT_KEY, value: "/etc/grafana/tls/tls.key"}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - {name: GF_SECURITY_COOKIE_SAMESITE, value: "strict"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 320Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: dashboard, mountPath: /etc/grafana/dashboards/cloudsentinel-overview.json, subPath: cloudsentinel-overview.json, readOnly: true}
            - {name: public-tls, mountPath: /etc/grafana/tls, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard-cloudsentinel
        - name: public-tls
          secret:
            secretName: grafana-public-tls
            defaultMode: 0440
