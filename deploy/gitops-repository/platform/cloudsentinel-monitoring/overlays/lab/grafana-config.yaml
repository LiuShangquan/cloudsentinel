apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: CloudSentinel
        orgId: 1
        folder: CloudSentinel
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
