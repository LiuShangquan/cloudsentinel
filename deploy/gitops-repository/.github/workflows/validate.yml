name: validate-gitops

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desired-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reject unconfigured or unsafe desired state
        shell: bash
        run: |
          set -euo pipefail
          active_paths=(
            apps/cloudsentinel/base
            apps/cloudsentinel/overlays/lab-staging
            apps/cloudsentinel/overlays/lab-production
            bootstrap
            platform/cloudsentinel-data/overlays/lab
            platform/cloudsentinel-secrets/overlays/lab-staging
            platform/cloudsentinel-secrets/overlays/lab-production
            platform/cloudsentinel-secrets/overlays/lab-data
          )
          if grep -RInE 'REPLACE_[A-Z0-9_]+|REPLACE_ORG|REPLACE_DOMAIN' "${active_paths[@]}"; then
            echo 'GitOps placeholders must be replaced before merge.' >&2
            exit 1
          fi
          for environment in lab-staging lab-production; do
            output="$(mktemp)"
            kubectl kustomize "apps/cloudsentinel/overlays/${environment}" >"${output}"
            if grep -Eq '^kind: (Secret|StatefulSet)$' "${output}"; then
              echo "forbidden Secret or StatefulSet in ${environment}" >&2
              exit 1
            fi
            if grep -Eq 'image: .*:latest([[:space:]]|$)' "${output}"; then
              echo "mutable image tag in ${environment}" >&2
              exit 1
            fi
            grep -Eq 'image: .+@sha256:[0-9a-f]{64}$' "${output}"
            image_count="$(grep -Ec 'image: crpi-1s64ln3ptbvgkqof-vpc\.cn-beijing\.personal\.cr\.aliyuncs\.com/cloudsentinel0306/cloudsentinel-(api|worker|migrate)@sha256:[0-9a-f]{64}$' "${output}")"
            test "${image_count}" -eq 3
          done
          migration_job=apps/cloudsentinel/base/migration-job.yaml
          grep -q '^      serviceAccountName: default$' "${migration_job}"
          grep -q '^      automountServiceAccountToken: false$' "${migration_job}"
          grep -A1 '^      imagePullSecrets:$' "${migration_job}" |
            grep -q '^        - name: cloudsentinel-registry$'
          data_output="$(mktemp)"
          kubectl kustomize platform/cloudsentinel-data/overlays/lab >"${data_output}"
          test "$(grep -c '^kind: StatefulSet$' "${data_output}")" -eq 2
          test "$(grep -c '^kind: PersistentVolume$' "${data_output}")" -eq 3
          test "$(grep -c '^  persistentVolumeReclaimPolicy: Retain$' "${data_output}")" -eq 3
          test "$(grep -c '^volumeBindingMode: Immediate$' "${data_output}")" -eq 1
          test "$(grep -c 'argocd.argoproj.io/sync-wave: \"-30\"' "${data_output}")" -eq 12
          test "$(grep -c 'argocd.argoproj.io/sync-wave: \"-20\"' "${data_output}")" -eq 2
          test "$(grep -c 'argocd.argoproj.io/sync-wave: \"-10\"' "${data_output}")" -eq 1
          test "$(grep -Ec '^[[:space:]]+node-role: data$' "${data_output}")" -eq 5
          test "$(grep -Ec '^[[:space:]]+kubernetes.io/hostname: worker-data-01$' "${data_output}")" -eq 5
          if grep -Eq '^  type: (NodePort|LoadBalancer)$' "${data_output}"; then
            echo 'data services must remain private ClusterIP services.' >&2
            exit 1
          fi
          data_image_count="$(grep -Ec 'image: crpi-1s64ln3ptbvgkqof-vpc\.cn-beijing\.personal\.cr\.aliyuncs\.com/cloudsentinel0306/cloudsentinel-(mysql|redis)@sha256:[0-9a-f]{64}$' "${data_output}")"
          test "${data_image_count}" -eq 6
          if grep -RIn 'newName: crpi-1s64ln3ptbvgkqof\.cn-beijing\.personal\.cr\.aliyuncs\.com' apps; then
            echo 'workloads must use the ACR VPC endpoint, not the public push endpoint.' >&2
            exit 1
          fi
          kubectl kustomize bootstrap/secret-store >/dev/null
          kubectl kustomize platform/cloudsentinel-secrets/overlays/lab-data >/dev/null
          kubectl kustomize bootstrap/argocd >/dev/null
