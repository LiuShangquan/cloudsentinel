name: release-images-and-stage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudsentinel-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ACR_PUBLIC_REGISTRY: crpi-1s64ln3ptbvgkqof.cn-beijing.personal.cr.aliyuncs.com
      ACR_DEPLOY_REGISTRY: crpi-1s64ln3ptbvgkqof-vpc.cn-beijing.personal.cr.aliyuncs.com
      ACR_NAMESPACE: cloudsentinel0306
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_owner }}" = "${{ vars.RELEASE_ALLOWED_OWNER }}"
          test "${{ github.event.repository.name }}" = "${{ vars.RELEASE_ALLOWED_REPOSITORY }}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${ACR_PUBLIC_REGISTRY}"
          test -n "${ACR_DEPLOY_REGISTRY}"
          test -n "${ACR_NAMESPACE}"
          command -v docker
          command -v gh
          command -v node
          docker buildx version
      - name: Log in to ACR Personal Edition
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACR_USERNAME}"
          test -n "${ACR_PASSWORD}"
          printf '%s' "${ACR_PASSWORD}" |
            docker login "${ACR_PUBLIC_REGISTRY}" \
              --username "${ACR_USERNAME}" \
              --password-stdin
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push API
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          build-args: TARGET=api
          push: true
          tags: ${{ env.ACR_PUBLIC_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-api:${{ github.sha }}
          platforms: linux/amd64
          # ACR Personal Edition rejects BuildKit's attached OCI attestation
          # manifests. Keep the runnable image and immutable digest publishable;
          # generate supply-chain evidence out-of-band until the registry is
          # upgraded to one that supports OCI referrers/attestations.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cloudsentinel-api
          cache-to: type=gha,mode=max,scope=cloudsentinel-api
      - name: Build and push Worker
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          build-args: TARGET=worker
          push: true
          tags: ${{ env.ACR_PUBLIC_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-worker:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cloudsentinel-worker
          cache-to: type=gha,mode=max,scope=cloudsentinel-worker
      - name: Build and push Migration
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migration
          push: true
          tags: ${{ env.ACR_PUBLIC_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-migrate:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cloudsentinel-migrate
          cache-to: type=gha,mode=max,scope=cloudsentinel-migrate
      - name: Build and push Web
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          target: runtime
          push: true
          tags: ${{ env.ACR_PUBLIC_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-web:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cloudsentinel-web
          cache-to: type=gha,mode=max,scope=cloudsentinel-web
      - name: Mint short-lived GitOps repository token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ vars.GITOPS_OWNER }}
          repositories: ${{ vars.GITOPS_REPOSITORY_NAME }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          persist-credentials: true
      - name: Open staging release PR
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gitops-images.mjs \
            --file gitops/apps/cloudsentinel/overlays/lab-staging/kustomization.yaml \
            --registry "${ACR_DEPLOY_REGISTRY}/${ACR_NAMESPACE}" \
            --api-digest "${API_DIGEST}" \
            --worker-digest "${WORKER_DIGEST}" \
            --migrate-digest "${MIGRATE_DIGEST}" \
            --web-digest "${WEB_DIGEST}"
          if git -C gitops diff --quiet -- apps/cloudsentinel/overlays/lab-staging/kustomization.yaml; then
            echo "Staging already references these image digests."
            exit 0
          fi
          cd gitops
          branch="release/cloudsentinel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          git config user.name cloudsentinel-release-bot
          git config user.email cloudsentinel-release-bot@users.noreply.github.com
          git add apps/cloudsentinel/overlays/lab-staging/kustomization.yaml
          git commit -m "release(staging): cloudsentinel ${GITHUB_SHA}"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --repo '${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}' \
            --base main --head "${branch}" \
            --title "release(staging): CloudSentinel ${GITHUB_SHA::12}" \
            --body "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}. Images are pinned by digest; merging lets Argo CD sync staging."
      - name: Log out of ACR
        if: always()
        run: docker logout "${ACR_PUBLIC_REGISTRY}" || true
