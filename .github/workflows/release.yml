name: release-images-and-stage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudsentinel-release
  cancel-in-progress: false

jobs:
  publish:
    # Ephemeral, organization-managed runner in the Alibaba Cloud account.
    # The runner image must contain Docker, jq, gh, Node.js and Alibaba Cloud CLI >=3.3.0.
    runs-on: [self-hosted, linux, x64, cloudsentinel-release]
    timeout-minutes: 45
    environment: registry-release
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
      ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate hardened runner
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_owner }}" = "${{ vars.RELEASE_ALLOWED_OWNER }}"
          test "${{ github.event.repository.name }}" = "${{ vars.RELEASE_ALLOWED_REPOSITORY }}"
          test "${GITHUB_REF}" = "refs/heads/main"
          command -v docker
          command -v jq
          command -v gh
          command -v node
          command -v aliyun
          docker buildx version
          aliyun version
      - name: Assume Alibaba Cloud release role with OIDC
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.ALIBABA_CLOUD_RELEASE_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_GITHUB_OIDC_PROVIDER_ARN }}
          role-session-name: cloudsentinel-${{ github.run_id }}
          audience: ${{ vars.ALIBABA_CLOUD_OIDC_AUDIENCE }}
      - name: Log in to ACR with a temporary token
        shell: bash
        run: |
          set -euo pipefail
          response="$(aliyun cr GetAuthorizationToken \
            --region '${{ vars.ALIBABA_CLOUD_REGION }}' \
            --endpoint "${ACR_API_ENDPOINT}" \
            --InstanceId "${ACR_INSTANCE_ID}")"
          username="$(jq -er '.TempUsername' <<<"${response}")"
          password="$(jq -er '.AuthorizationToken' <<<"${response}")"
          echo "::add-mask::${password}"
          printf '%s' "${password}" | docker login "${ACR_REGISTRY}" --username "${username}" --password-stdin
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push API
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          build-args: TARGET=api
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-api:${{ github.sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cloudsentinel-api
          cache-to: type=gha,mode=max,scope=cloudsentinel-api
      - name: Build and push Worker
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          build-args: TARGET=worker
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-worker:${{ github.sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cloudsentinel-worker
          cache-to: type=gha,mode=max,scope=cloudsentinel-worker
      - name: Build and push Migration
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migration
          push: true
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/cloudsentinel-migrate:${{ github.sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cloudsentinel-migrate
          cache-to: type=gha,mode=max,scope=cloudsentinel-migrate
      - name: Mint short-lived GitOps repository token
        id: gitops-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ vars.GITOPS_OWNER }}
          repositories: ${{ vars.GITOPS_REPOSITORY_NAME }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout GitOps repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          persist-credentials: true
      - name: Open staging release PR
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gitops-images.mjs \
            --file gitops/apps/cloudsentinel/overlays/staging/kustomization.yaml \
            --registry "${ACR_REGISTRY}/${ACR_NAMESPACE}" \
            --api-digest "${API_DIGEST}" \
            --worker-digest "${WORKER_DIGEST}" \
            --migrate-digest "${MIGRATE_DIGEST}"
          if git -C gitops diff --quiet -- apps/cloudsentinel/overlays/staging/kustomization.yaml; then
            echo "Staging already references these image digests."
            exit 0
          fi
          cd gitops
          branch="release/cloudsentinel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          git config user.name cloudsentinel-release-bot
          git config user.email cloudsentinel-release-bot@users.noreply.github.com
          git add apps/cloudsentinel/overlays/staging/kustomization.yaml
          git commit -m "release(staging): cloudsentinel ${GITHUB_SHA}"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --repo '${{ vars.GITOPS_OWNER }}/${{ vars.GITOPS_REPOSITORY_NAME }}' \
            --base main --head "${branch}" \
            --title "release(staging): CloudSentinel ${GITHUB_SHA::12}" \
            --body "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}. Images are pinned by digest; merging lets Argo CD sync staging."
      - name: Log out of ACR
        if: always()
        run: docker logout "${ACR_REGISTRY}" || true
