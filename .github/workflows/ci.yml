name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module and formatting
        shell: bash
        run: |
          go mod verify
          test -z "$(gofmt -l .)"
      - name: Vet and test
        run: |
          go vet ./...
          go test -count=1 ./...
          node --test scripts/gitops-images.test.mjs
          node --test scripts/gitops-data-images.test.mjs
      - name: Build processes
        run: |
          go build -trimpath -o /tmp/cloudsentinel-api ./cmd/api
          go build -trimpath -o /tmp/cloudsentinel-worker ./cmd/worker

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate cluster smoke-test assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/kubernetes/prepare-cluster-test-image-alinux4.sh
          bash -n deploy/kubernetes/run-cluster-network-smoke.sh
          bash -n deploy/kubernetes/install-external-secrets.sh
          bash -n deploy/kubernetes/build-argocd-bundle.sh
          bash -n deploy/kubernetes/install-argocd.sh
          test "$(grep -c '^kind: Pod$' deploy/kubernetes/tests/network-smoke.yaml)" -eq 3
          test "$(grep -c 'imagePullPolicy: Never' deploy/kubernetes/tests/network-smoke.yaml)" -eq 3
          test "$(grep -c '^kind: NetworkPolicy$' deploy/kubernetes/tests/network-policy-smoke.yaml)" -eq 2
          test "$(grep -c 'cloudsentinel-toolbox:1.37.0' deploy/kubernetes/tests/network-smoke.yaml)" -eq 3
          if grep -R -E 'TRUSTED_.*IMAGE|REPLACE_|<[^>]+>' \
            deploy/kubernetes/tests \
            deploy/kubernetes/prepare-cluster-test-image-alinux4.sh \
            deploy/kubernetes/run-cluster-network-smoke.sh \
            deploy/kubernetes/install-external-secrets.sh \
            deploy/kubernetes/build-argocd-bundle.sh \
            deploy/kubernetes/install-argocd.sh; then
            echo 'cluster smoke-test assets contain unresolved placeholders' >&2
            exit 1
          fi
          grep -Fq 'EXPECTED_VERSION="v2.8.0"' \
            deploy/kubernetes/install-external-secrets.sh
          grep -Fq '7d1533a7ace1f0ee9a21ac2215665e8f5856690ca7b224961df2011ff735d572' \
            deploy/kubernetes/install-external-secrets.sh
          grep -Fq -- '--dns-name=external-secrets-webhook.external-secrets.svc' \
            deploy/kubernetes/install-external-secrets.sh
          grep -Fq 'readonly ARGOCD_VERSION="v3.5.0"' \
            deploy/kubernetes/build-argocd-bundle.sh
          grep -Fq 'EXPECTED_VERSION="v3.5.0"' \
            deploy/kubernetes/install-argocd.sh
          grep -Fq 'a32bf36a437071a1f563ebf9e81c8a39fba9057c17db7d5d041afb7b6e3f4afe' \
            deploy/kubernetes/build-argocd-bundle.sh
          grep -Fq 'a32bf36a437071a1f563ebf9e81c8a39fba9057c17db7d5d041afb7b6e3f4afe' \
            deploy/kubernetes/install-argocd.sh
      - name: Render and audit Kustomize overlays
        shell: bash
        run: |
          set -euo pipefail
          kubectl version --client
          for environment in staging production lab-staging lab-production; do
            output="$(mktemp)"
            kubectl kustomize "deploy/gitops-repository/apps/cloudsentinel/overlays/${environment}" >"${output}"
            if grep -Eq '^kind: (Secret|StatefulSet)$' "${output}"; then
              echo "forbidden Secret or StatefulSet in ${environment}" >&2
              exit 1
            fi
            grep -q 'kind: Deployment' "${output}"
            grep -q 'argocd.argoproj.io/hook: PreSync' "${output}"
            image_count="$(grep -Ec 'image: crpi-1s64ln3ptbvgkqof-vpc\.cn-beijing\.personal\.cr\.aliyuncs\.com/cloudsentinel0306/cloudsentinel-(api|worker|migrate)@sha256:' "${output}")"
            test "${image_count}" -eq 3
          done
          data_output="$(mktemp)"
          kubectl kustomize deploy/gitops-repository/platform/cloudsentinel-data/overlays/lab >"${data_output}"
          test "$(grep -c '^kind: StatefulSet$' "${data_output}")" -eq 2
          test "$(grep -c '^kind: PersistentVolume$' "${data_output}")" -eq 3
          test "$(grep -c '^  persistentVolumeReclaimPolicy: Retain$' "${data_output}")" -eq 3
          test "$(grep -Ec '^[[:space:]]+node-role: data$' "${data_output}")" -eq 5
          test "$(grep -Ec '^[[:space:]]+kubernetes.io/hostname: worker-data-01$' "${data_output}")" -eq 5
          if grep -Eq '^  type: (NodePort|LoadBalancer)$' "${data_output}"; then
            echo 'data services must remain private ClusterIP services' >&2
            exit 1
          fi
          kubectl kustomize deploy/gitops-repository/bootstrap/secret-store >/dev/null
          kubectl kustomize deploy/gitops-repository/platform/cloudsentinel-secrets/overlays/lab-data >/dev/null
          kubectl kustomize deploy/gitops-repository/bootstrap/argocd >/dev/null
