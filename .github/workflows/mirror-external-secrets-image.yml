name: mirror-external-secrets-image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudsentinel-external-secrets-image-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACR_PUBLIC_REGISTRY: crpi-1s64ln3ptbvgkqof.cn-beijing.personal.cr.aliyuncs.com
      ACR_DEPLOY_REGISTRY: crpi-1s64ln3ptbvgkqof-vpc.cn-beijing.personal.cr.aliyuncs.com
      ACR_NAMESPACE: cloudsentinel0306
      EXTERNAL_SECRETS_VERSION: v2.8.0
      EXTERNAL_SECRETS_MANIFEST_SHA256: 7d1533a7ace1f0ee9a21ac2215665e8f5856690ca7b224961df2011ff735d572
    steps:
      - name: Checkout source repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate mirror boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository_owner }}" = "${{ vars.RELEASE_ALLOWED_OWNER }}"
          test "${{ github.event.repository.name }}" = "${{ vars.RELEASE_ALLOWED_REPOSITORY }}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${EXTERNAL_SECRETS_VERSION}" = "v2.8.0"
          test "${EXTERNAL_SECRETS_MANIFEST_SHA256}" = \
            "7d1533a7ace1f0ee9a21ac2215665e8f5856690ca7b224961df2011ff735d572"
          docker version
          kubectl version --client

      - name: Log in to ACR Personal Edition
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACR_USERNAME}"
          test -n "${ACR_PASSWORD}"
          printf '%s' "${ACR_PASSWORD}" |
            docker login "${ACR_PUBLIC_REGISTRY}" \
              --username "${ACR_USERNAME}" \
              --password-stdin

      - name: Mirror pinned External Secrets image for linux amd64
        id: image
        shell: bash
        run: |
          set -euo pipefail

          source="ghcr.io/external-secrets/external-secrets:${EXTERNAL_SECRETS_VERSION}"
          target="${ACR_PUBLIC_REGISTRY}/${ACR_NAMESPACE}/cloudsentinel-external-secrets:${EXTERNAL_SECRETS_VERSION}"

          docker pull --platform linux/amd64 "${source}"
          platform="$(docker image inspect \
            --format '{{.Os}}/{{.Architecture}}' "${source}")"
          test "${platform}" = 'linux/amd64'

          docker tag "${source}" "${target}"
          push_output="$(docker push "${target}" 2>&1 | tee /dev/stderr)"
          digest="$(printf '%s\n' "${push_output}" |
            sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' |
            tail -n 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          echo "platform=${platform}" >>"${GITHUB_OUTPUT}"

      - name: Build checksum-verified offline installation bundle
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          readonly source_image_name="ghcr.io/external-secrets/external-secrets"
          readonly source_image="${source_image_name}:${EXTERNAL_SECRETS_VERSION}"
          readonly deploy_image="${ACR_DEPLOY_REGISTRY}/${ACR_NAMESPACE}/cloudsentinel-external-secrets"
          readonly release_url="https://github.com/external-secrets/external-secrets/releases/download/${EXTERNAL_SECRETS_VERSION}/external-secrets.yaml"
          readonly bundle_dir="external-secrets-bundle"

          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "${bundle_dir}"

          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors \
            --output "${bundle_dir}/external-secrets.upstream.yaml" \
            "${release_url}"

          printf '%s  %s\n' \
            "${EXTERNAL_SECRETS_MANIFEST_SHA256}" \
            "${bundle_dir}/external-secrets.upstream.yaml" |
            sha256sum --check --strict

          test "$(grep -Fc "image: ${source_image}" \
            "${bundle_dir}/external-secrets.upstream.yaml")" -eq 3
          test "$(grep -c '^kind: Deployment$' \
            "${bundle_dir}/external-secrets.upstream.yaml")" -eq 3
          test "$(grep -Ec '^[[:space:]]*namespace: default$' \
            "${bundle_dir}/external-secrets.upstream.yaml")" -eq 16
          test "$(grep -Ec '=default$' \
            "${bundle_dir}/external-secrets.upstream.yaml")" -eq 2

          sed \
            -e 's/namespace: default$/namespace: external-secrets/' \
            -e 's/=default$/=external-secrets/' \
            "${bundle_dir}/external-secrets.upstream.yaml" \
            >"${bundle_dir}/external-secrets.namespaced.yaml"

          if grep -Eq '^[[:space:]]*namespace: default$|=default$' \
            "${bundle_dir}/external-secrets.namespaced.yaml"; then
            echo 'namespace normalization is incomplete' >&2
            exit 1
          fi

          cat >"${bundle_dir}/namespace.yaml" <<'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: external-secrets
          EOF

          cat >"${bundle_dir}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - namespace.yaml
            - external-secrets.namespaced.yaml
          images:
            - name: ${source_image_name}
              newName: ${deploy_image}
              digest: ${IMAGE_DIGEST}
          patches:
            - target:
                group: apps
                version: v1
                kind: Deployment
                namespace: external-secrets
              patch: |-
                - op: add
                  path: /spec/template/spec/imagePullSecrets
                  value:
                    - name: platform-acr-registry
                - op: add
                  path: /spec/template/spec/nodeSelector
                  value:
                    node-role: app
                - op: add
                  path: /spec/template/spec/containers/0/resources
                  value:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      cpu: 250m
                      memory: 256Mi
          EOF

          cat >"${bundle_dir}/metadata.env" <<EOF
          EXTERNAL_SECRETS_VERSION=${EXTERNAL_SECRETS_VERSION}
          UPSTREAM_MANIFEST_URL=${release_url}
          UPSTREAM_MANIFEST_SHA256=${EXTERNAL_SECRETS_MANIFEST_SHA256}
          SOURCE_IMAGE=${source_image}
          DEPLOY_IMAGE=${deploy_image}@${IMAGE_DIGEST}
          PLATFORM=linux/amd64
          EOF

          kubectl kustomize "${bundle_dir}" >"${bundle_dir}/external-secrets.rendered.yaml"
          test "$(grep -Fc "image: ${deploy_image}@${IMAGE_DIGEST}" \
            "${bundle_dir}/external-secrets.rendered.yaml")" -eq 3
          test "$(grep -c 'name: platform-acr-registry' \
            "${bundle_dir}/external-secrets.rendered.yaml")" -eq 3
          test "$(grep -c 'node-role: app' \
            "${bundle_dir}/external-secrets.rendered.yaml")" -eq 3
          if grep -Fq 'image: ghcr.io/' \
            "${bundle_dir}/external-secrets.rendered.yaml"; then
            echo 'rendered bundle still contains a public registry image' >&2
            exit 1
          fi

          (
            cd "${bundle_dir}"
            sha256sum \
              external-secrets.upstream.yaml \
              external-secrets.namespaced.yaml \
              namespace.yaml \
              kustomization.yaml \
              metadata.env \
              external-secrets.rendered.yaml \
              >checksums.sha256
          )

          {
            echo '## External Secrets offline bundle'
            echo
            echo '| Source | Target | Platform | Digest |'
            echo '|---|---|---|---|'
            printf '| `%s` | `%s` | `%s` | `%s` |\n' \
              "${source_image}" "${deploy_image}" \
              '${{ steps.image.outputs.platform }}' "${IMAGE_DIGEST}"
            echo
            printf 'Official manifest SHA256: `%s`\n' \
              "${EXTERNAL_SECRETS_MANIFEST_SHA256}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload offline installation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-secrets-v2.8.0-linux-amd64
          path: external-secrets-bundle
          if-no-files-found: error
          retention-days: 14

      - name: Log out of ACR
        if: always()
        run: docker logout "${ACR_PUBLIC_REGISTRY}" || true
